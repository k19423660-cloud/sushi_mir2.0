<!doctype html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Адмінпанель — Sushi Mir</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/admin.css"></head><body class="admin-body"><header class="topbar"><a class="brand" href="/"><span class="brand-mark">鮨</span><span>SUSHI <b>MIR</b><small>ADMIN PANEL</small></span></a><a class="back-link" href="/">← На сайт</a></header><main class="admin-wrap"><div class="eyebrow"><i></i> КЕРУВАННЯ МЕНЮ</div><h1>Адмін<em>панель</em></h1><p class="admin-warning">Увага: панель без пароля, як ти просив. Будь-хто, хто знає адресу /admin.html, зможе додавати й видаляти товари. Для реального магазину рекомендовано захистити її паролем.</p><section class="admin-card"><h2 id="formTitle">Додати товар</h2><form id="productForm"><input type="hidden" name="id"><label>Назва товару<input name="name" required maxlength="100" placeholder="Філадельфія"></label><label>Категорія<select name="category"><option>Роли</option><option>Сети</option><option>Запечені</option><option>Інше</option></select></label><label>Опис / склад<textarea name="description" rows="3" maxlength="500" placeholder="Лосось, сир Філадельфія, огірок..."></textarea></label><div class="admin-row"><label>Ціна, ₴<input name="price" type="number" min="1" required></label><label>Вага, г<input name="weight" type="number" min="1" required></label></div><label>Фото товару<input name="image" id="imageInput" type="file" accept="image/*"><small>JPG, PNG або WEBP. Рекомендовано до 2 МБ.</small></label><img id="imagePreview" class="image-preview" alt="Попередній перегляд"><div class="admin-actions"><button class="checkout-btn" type="submit">Зберегти товар ↗</button><button class="cancel-btn" type="button" id="cancelEdit">Очистити</button></div><p class="form-message" id="adminMessage"></p></form></section><section class="admin-list"><div class="admin-list-head"><h2>Товари в меню</h2><span id="productCount">0 позицій</span></div><div id="adminProducts" class="admin-products">Завантаження...</div></section></main><script src="/admin.js"></script></body></html>
